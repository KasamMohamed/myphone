<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Demande de devis - MyPhone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: #3baada;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
    <h1>Contact</h1>
</head>
<body>
    <h2>Vous avez des questions concernant les coûts d’une réparation ? Vous voulez
        prendre rendez-vous ? Contactez-nous par téléphone, par message ou
        franchissez les portes de notre boutique à Morez.</h2>
    <form action="/submit_appointment" method="post">
        <h3>Demande de devis graruit:</h3>
        <label for="device_model">Marque de l'appareil</label>
        <input type="text" id="marque" name="marque" required>
        <label for="device_model">Modèle de l'appareil</label>
        <input type="text" id="modele" name="modele" required>

        <label for="issue_type">Problème de l'appareil</label>
        <select id="issue_type" name="issue_type" required>
            <option value="">Sélectionnez le problème</option>
            <option value="ecran">Écran</option>
            <option value="batterie">Batterie</option>
            <option value="camera">Caméra</option>
            <option value="connectique">Connectiques</option>
            <option value="haut_parleur">Haut-parleur</option>
            <option value="haut_parleur">Bouton</option>
            <option value="haut_parleur">Vitre arrière</option>
            <option value="autre">Autres</option>
        </select>

        <label for="issue_description">Description de la panne</label>
        <textarea id="issue_description" name="issue_description" rows="4" placeholder="Décrivez le problème en quelques mots"></textarea>

        <label for="first_name">Prénom</label>
        <input type="text" id="first_name" name="first_name" required>

        <label for="last_name">Nom</label>
        <input type="text" id="last_name" name="last_name" required>

        <label for="phone_number">Numéro de téléphone</label>
        <input type="tel" id="phone_number" name="phone_number" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="appointment_date">Date du rendez-vous</label>
        <input type="date" id="appointment_date" name="appointment_date" required>

        <label for="appointment_time">Heure du rendez-vous</label>
        <input type="time" id="appointment_time" name="appointment_time" required>

        <input type="submit" value="Envoyer">
    </form>
</body>
</html>
